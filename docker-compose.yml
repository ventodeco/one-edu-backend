version: '3'
services:
  db:
    image: postgres:13-alpine
    ports:
      - "5432:5432"
    volumes:
      - "pg-data:/var/lib/postgresql/data"
    environment:
      - POSTGRES_DB=one_edu_app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    networks:
      - app-network

  redis:
    image: redis:6.2.5
    volumes:
      - "redis-data:/data"
    ports:
      - "6379:6379"
    networks:
      - app-network

volumes:
  pg-data: {}
  redis-data: {}

networks:
  app-network:
    driver: bridge
    name: app-network