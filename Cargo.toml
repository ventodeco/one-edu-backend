[package]
name = "one-edu-backend"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "one-edu-backend"

[dependencies]
actix-cors = "0.7.0"
actix-http = "3.9.0"
actix-web = "4.9.0"
argon2 = "0.5.3"
async-trait = "0.1.83"
chrono = "0.4.39"
dotenv = "0.15.0"
env_logger = "0.10.0"
jsonwebtoken = "9.3.0"
log4rs = "1.3.0"
sqlx = { version = "0.8.2", features = ["runtime-tokio", "chrono", "postgres", "uuid"] }
log = "0.4.22"
uuid = { version = "1.11.0", features = ["v7", "serde"] }
async_once = "0.2.6"
derive_more = { version = "1.0.0", features = ["full"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
ring = { version = "0.17.8", features = ["std"] }
